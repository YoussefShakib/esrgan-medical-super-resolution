experiment_name: srresnet_bach_x4
model_name: srresnet
scale: 4
seed: 42
device: auto
save_dir: runs

dataset:
  train_hr_dir: datasets/train_HR
  val_hr_dir: datasets/val_HR
  image_mode: RGB
  patch_size: 128
  eval_crop_size: 512
  degradation:
    method: mixed
    mixed_methods: [bicubic, bilinear, nearest]
    blur_prob: 0.25
    blur_radius_min: 0.2
    blur_radius_max: 1.2
    noise_prob: 0.25
    noise_std_min: 1.0
    noise_std_max: 8.0
    jpeg_prob: 0.25
    jpeg_quality_min: 35
    jpeg_quality_max: 90
    srcnn_resize: bicubic

training:
  batch_size: 4
  num_workers: 0
  epochs: 35
  lr: 0.0001
  lr_step: 30
  lr_gamma: 0.5
